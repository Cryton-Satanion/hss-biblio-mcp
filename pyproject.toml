[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hss-biblio-mcp"
version = "0.5.0"
description = "MCP server for multilingual Humanities and Social Sciences book lists and literature lists"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
hss-biblio-mcp = "hss_biblio_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
